<style>

*{box-sizing:border-box}
body{margin:0;font:15px/1.6 'IBM Plex Sans Arabic',Tahoma,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:210px;background:var(--ink);color:#cfe0e6;padding:18px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}
nav h1{font-size:16px;margin:0 8px 16px;color:#fff}
nav a{display:block;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;margin-bottom:2px}

main{flex:1;padding:24px;max-width:1100px;min-width:0}
h2{margin:0 0 16px;font-size:22px}h3{margin:20px 0 10px;font-size:16px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.k{color:var(--mut);font-size:13px}.v{font-size:22px;font-weight:700}
button,.btn{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}

input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
label{font-size:13px;color:var(--mut);display:block}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{background:#e6edf0;color:var(--ink);padding:5px 12px;border-radius:20px;cursor:pointer;font-size:13px}
.chip.on{background:var(--acc);color:#fff}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}th{background:#eaf0f2;color:var(--mut);font-weight:500}
.wrap{overflow-x:auto}
.row{display:flex;align-items:center;gap:10px;margin:6px 0}.row .n{width:130px;font-size:13px}.row .b{height:14px;background:var(--acc);border-radius:4px;min-width:2px}
.row .s{font-size:12px;color:var(--mut);white-space:nowrap}
.tag{background:#dff3e7;color:#1b7a43;padding:1px 8px;border-radius:10px;font-size:12px}
#ov,#login{position:fixed;inset:0;background:rgba(10,30,40,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
#login{background:var(--ink);align-items:center}
.box{background:#fff;border-radius:12px;padding:20px;width:100%;max-width:720px}
iframe,.box img{width:100%;height:480px;border:1px solid var(--line);border-radius:8px;object-fit:contain}
dl{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:0 0 14px}dt{color:var(--mut)}dd{margin:0}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:8px}nav h1{display:none}nav a{white-space:nowrap}main{padding:14px}}
@media print{nav,.noprint{display:none}}
</style>
</head>

dash(){const n=new Date(),y=n.getFullYear(),m=n.getMonth()+1;
 return `<div style="display:flex;justify-content:space-between;align-items:center"><h2>الرئيسية</h2><a class="btn big" href="#/add">+ إضافة فاتورة</a></div>

 <div class="f" style="margin-bottom:12px"><select onchange="flt.t=this.value;res()">${opts(FT,flt.t,'كل أنواع الرسوم')}</select><select onchange="flt.s=this.value;res()">${opts(terms,flt.s,'كل الفصول')}</select><select onchange="flt.p=this.value;res()">${opts(PM,flt.p,'كل طرق الدفع')}</select></div><div id="res"></div>`},
form(id){const x=inv.find(i=>i.id==id)||{pay_date:new Date().toISOString().slice(0,10),discount:0,tax:0,amount:'',fee_type:FT[2],method:PM[0]};
 const fl=(l,h)=>`<div><label>${l}</label>${h}</div>`,v=k=>esc(x[k]??'');
 return `<h2>${id?'تعديل فاتورة':'إضافة فاتورة'}</h2><form id="fm" class="card" onsubmit="saveInv(event,'${id||''}')"><div class="f">
 ${fl('رقم الفاتورة',`<input name="number" value="${v('number')}">`)}${fl('تاريخ الدفع *',`<input type="date" name="pay_date" required value="${v('pay_date')}">`)}
 ${fl('الجهة التعليمية / الجامعة',`<input name="institution" value="${v('institution')}">`)}${fl('نوع الرسوم',`<select name="fee_type">${opts(FT,x.fee_type)}</select>`)}
 ${fl('الفصل الدراسي',`<select name="term_id">${opts(terms,x.term_id,'— بدون —')}</select>`)}${fl('المادة / المقرر (اختياري)',`<input name="course" value="${v('course')}">`)}
 ${fl('المبلغ قبل الخصم',`<input type="number" step="0.01" name="amount" value="${v('amount')}" oninput="calc()">`)}${fl('الخصم',`<input type="number" step="0.01" name="discount" value="${v('discount')}" oninput="calc()">`)}
 ${fl('الضريبة',`<input type="number" step="0.01" name="tax" value="${v('tax')}" oninput="calc()">`)}${fl('المبلغ النهائي المدفوع',`<input type="number" step="0.01" name="total" value="${v('total')}">`)}
 ${fl('طريقة الدفع',`<select name="method">${opts(PM,x.method)}</select>`)}${fl('ملف الفاتورة (PDF/JPG/PNG)'+(x.file_name?` — الحالي: ${esc(x.file_name)}، اختر ملفًا لاستبداله`:''),`<input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png">`)}</div>
 <p>${fl('ملاحظات',`<textarea name="notes" rows="2">${v('notes')}</textarea>`)}</p><button>حفظ الفاتورة</button> <a class="btn g" href="#/archive">إلغاء</a></form>`},
expenses(){const ys=[...new Set(inv.map(yr))].sort().reverse(),mx=inv.slice().sort((a,b)=>b.total-a.total)[0],
 mm=by(inv,x=>yr(x)+' '+MO[mo(x)-1]).sort((a,b)=>b[1]-a[1])[0],su=f=>sum(inv.filter(f));
 return `<h2>المصروفات الدراسية</h2><div class="grid">
 <div class="card"><div class="k">أكثر شهر دفعت فيه</div><div class="v">${mm?mm[0]:'—'}</div><div class="k">${mm?money(mm[1]):''}</div></div>
 <div class="card"><div class="k">أعلى فاتورة</div><div class="v">${mx?money(mx.total):'—'}</div></div>
 <div class="card"><div class="k">المواد</div><div class="v">${money(su(x=>x.fee_type=='رسوم مادة'))}</div></div>
 <div class="card"><div class="k">الاختبارات</div><div class="v">${money(su(x=>x.fee_type=='رسوم اختبار'))}</div></div></div>
 <h3>حسب الفصل الدراسي</h3><div class="card">${bars(terms.map(t=>[t.name,sum(inv.filter(x=>x.term_id==t.id))]))}</div>
 ${ys.map(y=>{const l=inv.filter(x=>yr(x)==y);return `<h3>${y}</h3><div class="grid"><div class="card"><div class="k">حسب النوع</div>${bars(by(l,x=>x.fee_type))}<hr><b>الإجمالي: ${money(sum(l))}</b></div><div class="card"><div class="k">حسب الأشهر</div>${bars(MO.map((n,i)=>[n,sum(l.filter(x=>mo(x)==i+1))]).filter(r=>r[1]))}</div></div>`}).join('')}`},
terms(){const t=flt.term?terms.find(t=>t.id==flt.term):null,l=t?inv.filter(x=>x.term_id==t.id):[];
 return `<h2>الفصول الدراسية</h2><div class="card" style="display:flex;gap:8px"><input id="tname" placeholder="مثال: Fall 2026"><button onclick="addTerm()">إضافة</button></div>
 <div class="bar">${terms.map(x=>`<span class="chip ${t&&t.id==x.id?'on':''}" onclick="flt.term='${x.id}';go()">${esc(x.name)} — ${money(sum(inv.filter(i=>i.term_id==x.id)))}</span>`).join('')}</div>
 ${t?`<h3>${esc(t.name)} — الإجمالي ${money(sum(l))} <button class="r" onclick="delTerm('${t.id}')">حذف الفصل</button></h3>${table(l)}`:''}`},

settings(){return `<h2>الإعدادات</h2><div class="card" style="max-width:420px"><h3 style="margin-top:0">تغيير كلمة المرور</h3><p><input id="po" type="password" placeholder="الحالية"></p><p><input id="pn" type="password" placeholder="الجديدة (6 أحرف على الأقل)"></p><button onclick="chPw()">تغيير</button> <button class="g" onclick="logout()">تسجيل الخروج</button></div>`}};
function matches(){const s=(flt.q||'').trim().toLowerCase();return inv.filter(x=>(!flt.y||yr(x)==flt.y)&&(!flt.m||mo(x)==flt.m)&&(!flt.t||x.fee_type==flt.t)&&(!flt.s||x.term_id==flt.s)&&(!flt.p||x.method==flt.p)&&(!s||[x.number,x.institution,x.fee_type,tn(x.term_id),x.course,x.method,x.pay_date,dt(x.pay_date),x.total,x.notes].join(' ').toLowerCase().includes(s)))}

 const l=inv.filter(x=>(!flt.ry||yr(x)==flt.ry)&&(!flt.rm||mo(x)==flt.rm)&&(!flt.rs||x.term_id==flt.rs)&&(!flt.rt||x.fee_type==flt.rt)),t=l.map(x=>x.total),c=l.length;window._rep=l;
 $('#rr').innerHTML=`<div class="grid" style="margin:12px 0">${[['عدد الفواتير',c],['إجمالي المدفوع',money(sum(l))],['متوسط الفاتورة',money(c?sum(l)/c:0)],['أعلى فاتورة',money(c?Math.max(...t):0)],['أقل فاتورة',money(c?Math.min(...t):0)]].map(a=>`<div class="card"><div class="k">${a[0]}</div><div class="v">${a[1]}</div></div>`).join('')}</div><button onclick="csv()">⬇ تصدير Excel / CSV</button>`}
function csv(){const h=['رقم الفاتورة','التاريخ','الجهة','نوع الرسوم','الفصل','المادة','قبل الخصم','الخصم','الضريبة','المدفوع','طريقة الدفع','ملاحظات'],c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const t=[h,...window._rep.map(x=>[x.number,x.pay_date,x.institution,x.fee_type,tn(x.term_id),x.course,x.amount,x.discount,x.tax,x.total,x.method,x.notes])].map(r=>r.map(c).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='invoices.csv';a.click()}
function calc(){const g=n=>+document.querySelector(`[name=${n}]`).value||0;document.querySelector('[name=total]').value=(g('amount')-g('discount')+g('tax')).toFixed(2)}
const rd=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});
async function packFile(f,ext){
 if(ext=='pdf'){if(f.size>650000)throw{message:'ملف PDF كبير (الحد 650KB). ارفع صورة بدلًا منه أو صغّر الملف'};return rd(f)}

 for(const [mx,q] of [[1600,.8],[1400,.7],[1200,.6],[1000,.5],[800,.45]]){const k=Math.min(1,mx/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const u=c.toDataURL('image/jpeg',q);if(u.length<900000)return u}

const bu=u=>{if(!u.startsWith('data:'))return u;const [h,b]=u.split(','),a=atob(b),n=new Uint8Array(a.length);for(let i=0;i<a.length;i++)n[i]=a.charCodeAt(i);return URL.createObjectURL(new Blob([n],{type:h.slice(5,h.indexOf(';'))}))};
